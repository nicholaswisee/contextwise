services:
    postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        environment:
            POSTGRES_USER: contextwise
            POSTGRES_PASSWORD: contextwise
            POSTGRES_DB: contextwise
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - "5435:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U contextwise -d contextwise"]
            interval: 2s
            timeout: 5s
            retries: 5

    api:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            DATABASE_URL: postgresql+asyncpg://contextwise:contextwise@postgres:5432/contextwise
            LOG_LEVEL: INFO
            DEBUG: "false"
            ENVIRONMENT: production
            OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
            LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-fake-default}
            LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
            LLM_MODELS_JSON: ${LLM_MODELS_JSON:-}
            CONTEXTWISE_EMBEDDING_MODEL: ${CONTEXTWISE_EMBEDDING_MODEL:-hash-256-v1}
            CONTEXTWISE_EMBEDDING_API_KEY: ${CONTEXTWISE_EMBEDDING_API_KEY:-}
            CONTEXTWISE_EMBEDDING_BASE_URL: ${CONTEXTWISE_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
            CONTEXTWISE_OWNER_TOKEN: ${CONTEXTWISE_OWNER_TOKEN:?Set CONTEXTWISE_OWNER_TOKEN before starting the API}
            CONTEXTWISE_DOCUMENT_STORE_PATH: /data/documents
        volumes:
            - document-data:/data/documents
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres-data:
    document-data:
