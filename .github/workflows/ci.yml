name: CI

on:
  push:
    branches: [main, "milestone-*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest -m "not integration" -v

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextwise
          POSTGRES_PASSWORD: contextwise
          POSTGRES_DB: contextwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextwise -d contextwise"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://contextwise:contextwise@localhost:5432/contextwise
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"

      - name: Install dependencies
        run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run migrations twice
        run: uv run alembic upgrade head

      - name: Downgrade migrations
        run: uv run alembic downgrade base

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextwise
          POSTGRES_PASSWORD: contextwise
          POSTGRES_DB: contextwise_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U contextwise -d contextwise_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://contextwise:contextwise@localhost:5434/contextwise_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.23"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run pytest -m integration -v
