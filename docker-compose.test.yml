name: contextwise-test

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: contextwise
      POSTGRES_PASSWORD: contextwise
      POSTGRES_DB: contextwise_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextwise -d contextwise_test"]
      interval: 2s
      timeout: 5s
      retries: 5
